name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Request JSONs
        run: |
          python3 -c "
          import json, glob, sys
          files = glob.glob('recipes/*/request.json') + glob.glob('examples/*/*.json')
          print(f'Checking {len(files)} JSON files...')
          for f in files:
              try:
                  with open(f) as fp:
                      d = json.load(fp)
                      assert 'model' in d, f'{f} missing model'
                      assert 'questions' in d, f'{f} missing questions'
                      for q_name, q in d['questions'].items():
                          assert 'type' in q, f'{q_name} in {f} missing type'
                          assert q['type'] in ('choice', 'score', 'noul'), f'{q_name} invalid type: {q[\"type\"]}'
              except Exception as e:
                  print(f'Validation failed for {f}: {e}', file=sys.stderr)
                  sys.exit(1)
          print('All recipe JSON payloads valid!')
          "
