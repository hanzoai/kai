# The canonical caller: all configuration is in /hanzo.yml.
name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    permissions:
      contents: write
      packages: write
    secrets: inherit
